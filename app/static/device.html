<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>KENA | Customer device</title><link rel="stylesheet" href="/static/device.css"><script defer src="/static/device.js"></script></head>
<body>
<div class="stage">
<div class="phone" id="phone" data-app="WHATSAPP">
  <div class="statusbar"><span id="clock">9:41</span><span class="notch" aria-hidden="true"></span><span class="status-icons" aria-hidden="true"><i></i><i></i><i></i><b></b></span></div>
  <div id="notification" class="notification" role="status" hidden><div class="notification-app"><span class="mail-icon" aria-hidden="true">✉</span> Mail · now</div><strong id="notification-title"></strong><span id="notification-text"></span></div>
  <header class="app-header">
    <span class="back" aria-hidden="true">‹</span>
    <div class="avatar" aria-hidden="true">K</div>
    <div class="who"><strong>KENA Bank <span class="verified" title="Verified business" aria-label="Verified business">✓</span></strong><small id="subtitle">Official business account</small></div>
  </header>
  <main id="thread" class="thread" aria-live="polite"><div class="empty">No messages yet</div></main>
  <div id="chips" class="chips" aria-label="Suggested replies"></div>
  <form id="composer" class="composer"><input id="text" placeholder="Message" autocomplete="off" maxlength="1000" aria-label="Message"><button id="send" aria-label="Send">➤</button></form>
  <div class="home-indicator" aria-hidden="true"></div>
</div>
<p class="caption" id="caption">Waiting for a flagged transfer…</p>
</div>
</body></html>
