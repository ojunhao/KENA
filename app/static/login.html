<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KENA | Sign in</title>
<style>
:root{--blue:#0f5fdc;--purple:#5f1ebe;--navy:#11234b;--line:#e2e6f0;--muted:#63718c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172443;padding:16px}
form{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;border-top:4px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--blue),var(--purple)) border-box;box-shadow:0 10px 40px #17244312}
h1{margin:0 0 4px;font-size:26px;color:var(--navy);letter-spacing:.5px}p{margin:0 0 22px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:14px 0 6px}input{width:100%;border:1px solid #c9d1e4;border-radius:6px;padding:11px 12px;font:inherit;font-size:14px}
input:focus{outline:2px solid #bad5ff;border-color:var(--blue)}button{margin-top:22px;width:100%;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:650;padding:12px;cursor:pointer}
.error{display:none;margin-top:14px;color:#982437;background:#fff0f1;border:1px solid #e9bfc7;border-radius:6px;padding:10px;font-size:13px}.error.show{display:block}
</style></head>
<body>
<form method="post" action="/login">
  <h1>KENA</h1><p>Intervention desk · sign in</p>
  <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" id="next">
  <button type="submit">Sign in</button>
  <div class="error" id="error" role="alert">That username or password is not right.</div>
</form>
<script>
const params = new URLSearchParams(location.search);
document.getElementById('next').value = params.get('next') || '/';
if (params.has('failed')) document.getElementById('error').classList.add('show');
</script>
</body></html>
